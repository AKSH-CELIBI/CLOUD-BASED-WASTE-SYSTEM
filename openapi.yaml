openapi: 3.1.0
info:
  title: Digital Wallet API
  version: 1.0.0
  description: API contract for the wallet frontend and backend services.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Accounts
  - name: Transactions
  - name: Admin
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: User and wallet created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthTokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /accounts/me:
    get:
      tags: [Accounts]
      operationId: getMyAccount
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user's wallet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /transactions/deposit:
    post:
      tags: [Transactions]
      operationId: deposit
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepositRequest'}
      responses:
        '200':
          description: Idempotent replay of an earlier successful deposit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '201':
          description: Deposit recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /transactions/transfer:
    post:
      tags: [Transactions]
      operationId: transfer
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRequest'}
      responses:
        '200':
          description: Idempotent replay of an earlier successful transfer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '201':
          description: Transfer recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /transactions/history:
    get:
      tags: [Transactions]
      operationId: getTransactionHistory
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Current user's transaction page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/accounts/{id}/freeze:
    patch:
      tags: [Admin]
      operationId: freezeAccount
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeRequest'}
      responses:
        '200': {description: Account freeze state updated}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: getAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Audit log page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 72, writeOnly: true}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 72, writeOnly: true}
    AuthTokenResponse:
      type: object
      required: [token]
      properties:
        token: {type: string}
    RegisterResponse:
      type: object
      required: [token, accountNumber]
      properties:
        token: {type: string}
        accountNumber: {type: string, pattern: '^\d{12}$'}
    Account:
      type: object
      required: [id, accountNumber, balance, currency, status]
      properties:
        id: {type: string, format: uuid}
        accountNumber: {type: string, pattern: '^\d{12}$'}
        balance: {type: string, pattern: '^\d+\.\d{4}$', example: '150.7500'}
        currency: {type: string, minLength: 3, maxLength: 3}
        status: {type: string, enum: [ACTIVE, FROZEN]}
    DepositRequest:
      type: object
      required: [amount]
      properties:
        amount: {type: string, pattern: '^\d+(\.\d{1,4})?$', example: '150.75'}
    TransferRequest:
      type: object
      required: [destinationAccountNumber, amount]
      properties:
        destinationAccountNumber: {type: string, pattern: '^\d{12}$'}
        amount: {type: string, pattern: '^\d+(\.\d{1,4})?$', example: '25.0000'}
    Transaction:
      type: object
      required: [id, type, amount, currency, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [DEPOSIT, TRANSFER]}
        amount: {type: string}
        currency: {type: string}
        status: {type: string, enum: [COMPLETED, FAILED]}
        createdAt: {type: string, format: date-time}
        destinationAccountNumber: {type: string}
    TransactionPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    FreezeRequest:
      type: object
      required: [frozen]
      properties:
        frozen: {type: boolean}
    AuditLogPage:
      type: object
      properties:
        content: {type: array, items: {type: object}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    ApiError:
      type: object
      required: [status, code, message, fieldErrors]
      properties:
        status: {type: integer}
        code: {type: string}
        message: {type: string}
        fieldErrors:
          type: object
          additionalProperties: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Insufficient access or foreign resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unprocessable:
      description: Idempotency key reused with a different payload or business rule failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ServiceUnavailable:
      description: Required downstream service is not configured
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
