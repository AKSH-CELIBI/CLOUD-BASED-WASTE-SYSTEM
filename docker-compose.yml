services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wallet-local-only}
      SPRING_DATA_REDIS_HOST: redis
      WALLET_JWT_SECRET: ${WALLET_JWT_SECRET:?Set WALLET_JWT_SECRET to at least 32 bytes}
      WALLET_CORS_ALLOWED_ORIGINS: ${WALLET_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      WALLET_ADMIN_EMAIL: ${WALLET_ADMIN_EMAIL:-}
      WALLET_ADMIN_PASSWORD: ${WALLET_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
